name: Sync public App Store version

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-store-version-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Apple's public listing
        run: python3 scripts/sync_app_store_release.py
      - name: Commit a changed public version record
        run: |
          if git diff --quiet -- docs/app-store-release.json; then
            echo "Apple public version is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app-store-release.json
          git commit -m "docs: sync public App Store version"
          git push
