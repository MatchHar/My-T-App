name: Sync public App Store version

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-version-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Read Apple's public listing
        run: python3 scripts/sync_app_store_release.py
      - name: Propose changed record and request protected merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/propose_app_store_release.sh
